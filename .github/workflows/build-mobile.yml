name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application & PWA Assets
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK & Release Bundle
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Workflare-Invoicing-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Release AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Workflare-Invoicing-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS Xcode App Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application & PWA Assets
        run: npm run build

      - name: Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: Build iOS Archive / Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO

      - name: Compress iOS App Archive
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          zip -r WorkflareInvoicing-iOS.app.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Workflare-Invoicing-iOS-App
          path: ios/App/build/Build/Products/Release-iphoneos/WorkflareInvoicing-iOS.app.zip
